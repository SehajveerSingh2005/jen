name: 'publish'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: set version from tag
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          # Use Python to reliably normalize version and update JSONs
          $version = python -c "
          import json, re, os
          ref_name = os.environ.get('REF_NAME', '')
          ref_type = os.environ.get('REF_TYPE', '')
          
          # Read current version from tauri.conf.json as fallback
          conf_path = 'src-tauri/tauri.conf.json'
          with open(conf_path, 'r', encoding='utf-8') as f:
              conf = json.load(f)
          current_version = conf.get('version', '0.1.0')
          
          version = current_version
          if ref_type == 'tag' or ref_name.startswith('v'):
              tag = ref_name.lstrip('v')
              match = re.match(r'^(\d+)(?:\.(\d+))?(?:\.(\d+))?(.*)$', tag)
              if match:
                  major, minor, patch, pre = match.groups()
                  major = major or '0'
                  minor = minor or '0'
                  patch = patch or '0'
                  semver = f'{major}.{minor}.{patch}'
                  if pre:
                      pre_clean = pre.lstrip('-').lstrip('.')
                      if pre_clean:
                          semver += f'-{pre_clean}'
                  version = semver
              else:
                  version = tag
          
          # Write to stdout so PowerShell can capture it
          print(version)
          
          # Update package.json
          with open('package.json', 'r') as f:
              pkg = json.load(f)
          pkg['version'] = version
          with open('package.json', 'w') as f:
              json.dump(pkg, f, indent=2)
          
          # Update tauri.conf.json
          conf['version'] = version
          with open(conf_path, 'w', encoding='utf-8') as f:
              json.dump(conf, f, indent=2, ensure_ascii=False)
          "
          
          echo "Normalized version: $version"
          echo "VERSION=$version" >> $env:GITHUB_ENV
          
          $tag = "${{ github.ref_name }}"
          if ("${{ github.ref_type }}" -ne "tag") {
              $tag = "v$version"
          }
          echo "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: build sidecar
        run: python src-tauri/build_sidecar.py

      - name: diagnostics and check
        shell: pwsh
        run: |
          Write-Host "--- Post-Sidecar Diagnostics ---"
          Write-Host "Searching for sidecar binary in the entire project:"
          Get-ChildItem -Path . -Recurse -Filter "stt-x86_64-pc-windows-msvc.exe" | Select-Object FullName
          
          Write-Host "Tauri Environment Info:"
          pnpm tauri info
          Write-Host "--- End Diagnostics ---"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'Jen ${{ env.RELEASE_TAG }}'
          releaseBody: |
            ## What's New
            See the changelog for details on this release.
            
            ### Installation
            1. Download the `.msi` or `.exe` below.
            2. Run the installer.
            3. Jen will start automatically!
          releaseDraft: true
          prerelease: false
          args: '--target x86_64-pc-windows-msvc'
